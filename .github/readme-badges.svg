<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Minimal profile badges for Juan David Moreno Alfonso</title>
  <desc id="desc">Two badge groups with modern pill styling for focus and engineering areas.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .eyebrow { font: 600 12px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; fill: #94a3b8; }
      .chipLabel { font: 600 12px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; fill: #cbd5e1; }
      .chipValue { font: 700 14px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: 0.01em; fill: #f8fafc; }
      .chipValueSoft { font: 700 14px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: 0.01em; fill: #e5e7eb; }
      .small { font: 500 11px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="rgba(255,255,255,0.08)"/>

  <text x="64" y="56" class="eyebrow">Profile headline</text>

  <g filter="url(#shadow)">
    <rect x="64" y="76" width="192" height="48" rx="16" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="74" y="86" width="78" height="28" rx="10" fill="#1f2937"/>
    <text x="92" y="104" class="chipLabel">Focus</text>
    <text x="166" y="105" class="chipValue">Frontend quality</text>

    <rect x="272" y="76" width="184" height="48" rx="16" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="282" y="86" width="80" height="28" rx="10" fill="url(#accentSoft)"/>
    <text x="301" y="104" class="chipLabel">Cloud</text>
    <text x="377" y="105" class="chipValueSoft">Architecture</text>

    <rect x="472" y="76" width="182" height="48" rx="16" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="482" y="86" width="120" height="28" rx="10" fill="url(#accent)"/>
    <text x="501" y="104" class="chipLabel">Priority</text>
    <text x="617" y="105" class="chipValue">Performance</text>
  </g>

  <text x="64" y="178" class="eyebrow">Engineering focus</text>

  <g filter="url(#shadow)">
    <rect x="64" y="198" width="170" height="44" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="72" y="206" width="72" height="28" rx="10" fill="#1f2937"/>
    <text x="89" y="224" class="chipLabel">Frontend</text>
    <text x="154" y="224" class="chipValueSoft">UX &amp; polish</text>

    <rect x="248" y="198" width="182" height="44" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="256" y="206" width="104" height="28" rx="10" fill="url(#accent)"/>
    <text x="274" y="224" class="chipLabel">Performance</text>
    <text x="370" y="224" class="chipValue">Speed matters</text>

    <rect x="444" y="198" width="164" height="44" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="452" y="206" width="62" height="28" rx="10" fill="#1f2937"/>
    <text x="470" y="224" class="chipLabel">Cloud</text>
    <text x="524" y="224" class="chipValueSoft">AWS &amp; edge</text>

    <rect x="622" y="198" width="182" height="44" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="630" y="206" width="50" height="28" rx="10" fill="#1f2937"/>
    <text x="647" y="224" class="chipLabel">SEO</text>
    <text x="690" y="224" class="chipValueSoft">Technical quality</text>

    <rect x="818" y="198" width="186" height="44" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="826" y="206" width="106" height="28" rx="10" fill="url(#accentSoft)"/>
    <text x="844" y="224" class="chipLabel">Architecture</text>
    <text x="943" y="224" class="chipValueSoft">Clean systems</text>

    <rect x="64" y="254" width="202" height="44" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="72" y="262" width="40" height="28" rx="10" fill="#1f2937"/>
    <text x="88" y="280" class="chipLabel">DX</text>
    <text x="122" y="280" class="chipValueSoft">Developer experience</text>
  </g>

  <text x="64" y="302" class="small">Minimal SVG system — dark surface, restrained red accent, unified spacing and rounded geometry.</text>
</svg>
